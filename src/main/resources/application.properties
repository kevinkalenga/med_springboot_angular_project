spring.config.import=optional:file:.env[.properties]
spring.application.name=med_spring_project


spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

#spring.datasource.url=jdbc:mysql://localhost:3306/med_db
#spring.datasource.username=web
#spring.datasource.password=web0033


# JPA:Hibernate
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true 

#JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}

#SMTP Mail configuration
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587 

#Enable TLS SMTP Mail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls=true
spring.mail.properties.mail.smtp.starttls.required=true



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



